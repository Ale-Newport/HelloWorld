<!doctype html><html><head><meta charset="utf-8"><title>Vehicle integration review</title><link rel="icon" href="data:,"><style>body{margin:0;background:#aecbd2;font:13px system-ui}canvas{width:100vw;height:100vh;display:block}header{position:absolute;z-index:2;top:12px;left:12px;background:#132e36ee;color:white;padding:16px;border-radius:12px;max-width:560px}button,input{margin:5px;padding:7px}#readout{white-space:pre-line;font:12px monospace}</style><script type="importmap">{"imports":{"three":"../preview/vendor/three/build/three.module.js","three/addons/":"../preview/vendor/three/examples/jsm/","@dimforge/rapier3d-compat":"../preview/vendor/@dimforge/rapier3d-compat/rapier.es.js"}}</script></head><body><header><b>VEHICLE INTEGRATION REVIEW</b><div>WASD drive · SPACE handbrake · Double SPACE transforms</div><div>Plane: W/S speed · A/D turn · Q/E or arrows pitch</div><button id="reset">Respawn</button><button id="deep">Deep-water drop regression</button><label>Vehicle color <input id="color" type="color" value="#e86738"></label><div id="readout">Loading</div></header><canvas id="world" tabindex="0" aria-label="Vehicle test viewport"></canvas><script type="module">
import * as THREE from 'three';import {Physics,RAPIER} from '../preview/runtime/physics.js';import {Driving} from '../preview/runtime/driving.js';
await RAPIER.init();const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;const scene=new THREE.Scene();scene.background=new THREE.Color('#a7cbd5');scene.fog=new THREE.Fog('#a7cbd5',160,500);const camera=new THREE.PerspectiveCamera();const ambient=new THREE.HemisphereLight('#d9faff','#617959',2.5);scene.add(ambient);const sun=new THREE.DirectionalLight('#fff3db',3);sun.position.set(20,55,30);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-90,right:90,top:90,bottom:-90,near:1,far:150});scene.add(sun,sun.target);const ground=new THREE.Mesh(new THREE.BoxGeometry(350,1,350),new THREE.MeshStandardMaterial({color:'#88a26e',roughness:1}));ground.position.y=-.5;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(350,70,'#78965e','#91ab76');grid.position.y=.005;scene.add(grid);const physics=new Physics();physics.waterElevation=-.35;physics.add({type:'fixed',category:'floor',position:ground.position,colliders:[{shape:'cuboid',parameters:[175,.5,175]}],metadata:{ground_surface:true,surface_type:'road'}});const nav={spawn:[0,0,0],roads:[{samples:[[-150,0,0],[150,0,0]],width:8,name:'Vehicle review'}],loop:{points:[]},directSpawn:{position:[0,1.3,0],rotation:0},seaLevel:-.35};const driving=new Driving(physics,scene,camera,nav,new Set(),canvas);await driving.plane.ready;
document.querySelector('#deep').onclick=()=>{driving.modes.setMode(true);driving.vehicle.moveTo({x:230,y:25,z:0});driving.modes.setMode(false);canvas.focus();};
document.querySelector('#color').oninput=e=>driving.setColor(e.target.value);document.querySelector('#reset').onclick=()=>{driving.respawn();canvas.focus();};
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}resize();addEventListener('resize',resize);let previous=performance.now(),acc=0,lastStatus=0;function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-previous)/1000);previous=now;driving.inputs.update();acc+=dt;while(acc>=1/60){driving.fixed();acc-=1/60;}driving.render(dt,acc*60);renderer.render(scene,camera);if(now-lastStatus>200){const s=driving.status;document.querySelector('#readout').textContent=`MODE ${s.mode} · ${s.state}\nAltitude ${s.altitude.toFixed(1)}m · ${driving.vehicle.speedKmh.toFixed(1)}km/h · ${s.parked?'PARKED':'ACTIVE'}\nBodies ${physics.world.bodies.len()} · ${driving.vehicle.activeController?'CAR CONTROLLER':'PLANE CONTROLLER'}\nPosition ${driving.vehicle.position.toArray().map(v=>v.toFixed(2)).join(', ')}`;lastStatus=now;}}requestAnimationFrame(frame);canvas.focus();
</script></body></html>
